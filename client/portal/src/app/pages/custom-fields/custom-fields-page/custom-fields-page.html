<div class="container-fluid p-4">
  <header class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="display-6 fw-bold m-0">Custom Fields</h1>
      <p class="text-muted mb-0">Define dynamic attributes for your items</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAdd()">
      <mat-icon>add</mat-icon> New Field
    </button>
  </header>

  <mat-card appearance="outlined">
    <mat-card-content class="p-0">
      <div class="table-responsive">
        <table mat-table [dataSource]="fields()" class="w-100">

          <ng-container matColumnDef="label">
            <th mat-header-cell *matHeaderCellDef>Label</th>
            <td mat-cell *matCellDef="let f" class="fw-medium" [class.opacity-50]="!f.active">{{ f.label }}</td>
          </ng-container>

          <ng-container matColumnDef="key">
            <th mat-header-cell *matHeaderCellDef>Key</th>
            <td mat-cell *matCellDef="let f" class="text-muted font-monospace small" [class.opacity-50]="!f.active">{{ f.name }}</td>
          </ng-container>

          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let f">
              <mat-chip-set><mat-chip>{{ f.type }}</mat-chip></mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="itemTypes">
            <th mat-header-cell *matHeaderCellDef>Item Types</th>
            <td mat-cell *matCellDef="let f">
              <mat-chip-set>
                @for (tid of f.itemTypeIds; track tid) {
                  @if (getItemType(tid); as t) {
                    <mat-chip>{{ t.icon }} {{ t.name }}</mat-chip>
                  }
                }
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="required">
            <th mat-header-cell *matHeaderCellDef>Required</th>
            <td mat-cell *matCellDef="let f">
              @if (f.required) {
                <span class="badge bg-primary">Required</span>
              } @else {
                <span class="text-muted small">Optional</span>
              }
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let f">
              <mat-slide-toggle [checked]="f.active" (change)="toggleActive(f)" />
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let f">
              <button mat-icon-button (click)="openEdit(f)"><mat-icon>edit</mat-icon></button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
