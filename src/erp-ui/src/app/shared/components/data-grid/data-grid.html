<div class="table-responsive data-grid-container">

  @if (searchable()) {
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="searchQuery" placeholder="Search...">
      @if (searchQuery()) {
        <button matSuffix mat-icon-button (click)="searchQuery.set('')">
          <mat-icon>close</mat-icon>
        </button>
      }
    </mat-form-field>
  }

  <table mat-table [dataSource]="filteredData()" class="w-100">

    @for (col of columns(); track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef [class]="headerClass(col)">{{ col.label }}</th>
        <td mat-cell *matCellDef="let row" [class]="cellClass(col) + 'py-2'">
          @if (col.cellTemplate) {
            <ng-container *ngTemplateOutlet="col.cellTemplate; context: { $implicit: row }"/>
          } @else {
            {{ col.value ? col.value(row) : row[col.key] }}
          }
        </td>
      </ng-container>
    }

    @if (actionCellDirective) {
      <ng-container matColumnDef="__actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <ng-container *ngTemplateOutlet="actionCellDirective.templateRef; context: { $implicit: row }"/>
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="table-row-hover data-row"></tr>
  </table>
</div>
