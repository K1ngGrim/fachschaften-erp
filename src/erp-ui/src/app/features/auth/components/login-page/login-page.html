<div class="login-wrapper">
  <div class="login-bg-circle login-bg-circle--top"></div>
  <div class="login-bg-circle login-bg-circle--bottom"></div>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <mat-icon svgIcon="domain" />
      </div>
      <h1>Fachschaften ERP</h1>
      <p>Melde dich mit deinem Konto an</p>
    </div>

    <mat-card>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Benutzername oder E-Mail</mat-label>
            <mat-icon matPrefix svgIcon="account-outline" class="field-icon" />
            <input matInput formControlName="login" autocomplete="username" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Passwort</mat-label>
            <mat-icon matPrefix svgIcon="lock-outline" class="field-icon" />
            <input matInput formControlName="password"
                   [type]="showPassword() ? 'text' : 'password'"
                   autocomplete="current-password" />
            <button matSuffix mat-icon-button type="button"
                    [attr.aria-label]="showPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
                    (click)="showPassword.set(!showPassword())">
              <mat-icon [svgIcon]="showPassword() ? 'eye-off-outline' : 'eye-outline'" />
            </button>
          </mat-form-field>

          <div class="forgot-link">
            <a routerLink="/forgot-password">Passwort vergessen?</a>
          </div>

          @if (error()) {
            <mat-error class="error-box">
              <mat-icon svgIcon="alert-circle-outline" />
              {{ error() }}
            </mat-error>
          }

          <button mat-flat-button type="submit" class="w-100 submit-btn"
                  [disabled]="form.invalid || loading()">
            @if (loading()) { <mat-spinner diameter="18" /> } @else { Anmelden }
          </button>

        </form>
      </mat-card-content>
    </mat-card>

    <p class="login-footer">
      Noch kein Konto? Wende dich an die Administration deiner Fachschaft.<br />
      <a routerLink="/datenschutz">Datenschutz</a>
    </p>
  </div>
</div>
