<div class="container-fluid p-4">
  <app-page-header
    [title]="'Item Types'"
    [subtitle]="'Manage your item types here.'"
  >
  </app-page-header>

  <app-data-grid
    [columns]="columns()"
    [data]="itemTypes()"
    [searchable]="true"
    [searchKeys]="[]"
    [toolbarTemplate]="gridHeaderActions"
  >

    <ng-template #gridHeaderActions>
      <button mat-flat-button class="d-flex" (click)="openAdd()">
        <mat-icon svgIcon="plus" class="d-flex"></mat-icon>
        <span>Add</span>
      </button>
    </ng-template>

    <!-- Action Column via Directive -->
    <ng-template gridActionCell let-p>
      <div class="d-flex gap-1 justify-content-end">
        <button mat-icon-button matTooltip="View" (click)="openView(p)">
          <mat-icon svgIcon="eye-outline" />
        </button>
        <button mat-icon-button matTooltip="Edit" (click)="openEdit(p)">
          <mat-icon svgIcon="pencil-outline" />
        </button>
        <button mat-icon-button matTooltip="Delete" color="warn" (click)="deleteItem(p)">
          <mat-icon svgIcon="delete-outline" />
        </button>
      </div>
    </ng-template>
  </app-data-grid>

</div>
