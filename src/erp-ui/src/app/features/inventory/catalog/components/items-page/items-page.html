<div class="container-fluid p-4">
  <app-page-header [title]="'Artikel'" [subtitle]="'Stammdaten der Artikel verwalten.'">
    <button mat-flat-button class="d-flex" (click)="openAdd()">
      <mat-icon svgIcon="plus" class="d-flex"></mat-icon>
      <span>Neuer Artikel</span>
    </button>
  </app-page-header>

  <app-data-grid
    [title]="'Artikel'"
    [columns]="columns()"
    [data]="products()"
    [searchable]="true"
    [searchKeys]="['name']"
  >
    <ng-template gridActionCell let-p>
      <div class="d-flex gap-1 justify-content-end">
        <button mat-icon-button matTooltip="Details" (click)="viewDetail(p.id)">
          <mat-icon svgIcon="eye"></mat-icon>
        </button>
        <button mat-icon-button matTooltip="Bearbeiten" (click)="openEdit(p)">
          <mat-icon svgIcon="pencil"></mat-icon>
        </button>
        <button mat-icon-button matTooltip="Löschen" (click)="delete(p.id)">
          <mat-icon svgIcon="delete"></mat-icon>
        </button>
      </div>
    </ng-template>
  </app-data-grid>
</div>

<ng-template #typeTemplate let-row let-type="value">
  <span class="type-chip">{{ type }}</span>
</ng-template>
