<div class="container-fluid p-4">
  <header class="mb-4">
    <h1 class="display-6 fw-bold m-0">Financial Overview</h1>
    <p class="text-muted mb-0">Revenue, expenses, and profit at a glance</p>
  </header>

  <div class="row g-4 mb-4">
    <div class="col-12 col-sm-6 col-lg-3">
      <app-metric-card
        title="Total Revenue"
        [value]="formatCurrency(totalRevenue())"
        [subtitle]="'This month: ' + formatCurrency(currentMonth().revenue)"
        icon="payments">
      </app-metric-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-metric-card
        title="Total Expenses"
        [value]="formatCurrency(totalExpenses())"
        [subtitle]="'This month: ' + formatCurrency(currentMonth().expenses)"
        icon="trending_down">
      </app-metric-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-metric-card
        title="Net Profit"
        [value]="formatCurrency(profit())"
        [subtitle]="'Margin: ' + profitMargin() + '%'"
        icon="account_balance_wallet"
        trend="up">
      </app-metric-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <app-metric-card
        title="Inventory Value"
        [value]="formatCurrency(inventoryValue())"
        [subtitle]="data.products().length + ' items tracked'"
        icon="inventory_2">
      </app-metric-card>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-lg-6">
      <mat-card appearance="outlined" class="h-100">
        <mat-card-header><mat-card-title class="fs-6">Monthly Revenue &amp; Expenses</mat-card-title></mat-card-header>
        <mat-card-content>
          <canvas baseChart [data]="barChartData()" [options]="chartOptions" type="bar" style="max-height:300px"></canvas>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col-12 col-lg-6">
      <mat-card appearance="outlined" class="h-100">
        <mat-card-header><mat-card-title class="fs-6">Profit Trend</mat-card-title></mat-card-header>
        <mat-card-content>
          <canvas baseChart [data]="lineChartData()" [options]="chartOptions" type="line" style="max-height:300px"></canvas>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
