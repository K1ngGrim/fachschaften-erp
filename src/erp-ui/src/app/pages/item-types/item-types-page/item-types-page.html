<div class="container-fluid p-4">
  <header class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="display-6 fw-bold m-0">Item Types</h1>
      <p class="text-muted mb-0">Manage categories for your items</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAdd()">
      <mat-icon>add</mat-icon> New Type
    </button>
  </header>

  <div class="row g-4">
    @for (t of itemTypes(); track t.id) {
      <div class="col-12 col-sm-6 col-lg-4">
        <mat-card appearance="outlined" [class.opacity-50]="!t.active" class="h-100">
          <mat-card-content class="p-4">
            <div class="d-flex align-items-start justify-content-between">
              <div class="d-flex align-items-center gap-3">
                <span class="type-icon">{{ t.icon }}</span>
                <div>
                  <p class="fw-semibold mb-0">{{ t.name }}</p>
                  <p class="text-muted small mb-0">{{ t.description }}</p>
                </div>
              </div>
              <span class="badge" [class.bg-primary]="t.active" [class.bg-secondary]="!t.active">
                {{ t.active ? 'Active' : 'Inactive' }}
              </span>
            </div>

            <div class="d-flex align-items-center justify-content-between mt-4 pt-3 border-top">
              <mat-slide-toggle [checked]="t.active" (change)="toggleActive(t)">
                <span class="small text-muted">{{ t.active ? 'Active' : 'Inactive' }}</span>
              </mat-slide-toggle>
              <button mat-icon-button (click)="openEdit(t)">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    }
  </div>
</div>
