<h2 mat-dialog-title>Record Purchase</h2>

<mat-dialog-content class="pt-2">
  <div class="row g-3">
    <div class="col-12 col-sm-6">
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <mat-label>Date</mat-label>
        <input matInput type="date" [(ngModel)]="date" required />
      </mat-form-field>
    </div>
    <div class="col-12 col-sm-6">
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <mat-label>Supplier</mat-label>
        <input matInput [(ngModel)]="supplier" required />
      </mat-form-field>
    </div>
    <div class="col-12 col-sm-6">
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <mat-label>Item</mat-label>
        <mat-select [(ngModel)]="selectedProductId" (ngModelChange)="onProductChange()" required>
          @for (p of products(); track p.id) {
            <mat-option [value]="p.id">{{ p.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-12 col-sm-6">
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" min="1" [(ngModel)]="quantity" (ngModelChange)="onQuantityChange()" required />
      </mat-form-field>
    </div>
    <div class="col-12">
      <mat-form-field appearance="outline" class="w-100" subscriptSizing="dynamic">
        <mat-label>Total Price (€)</mat-label>
        <input matInput type="number" step="0.01" [(ngModel)]="totalPrice" required />
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="!selectedProductId || !date || !supplier">
    Record Purchase
  </button>
</mat-dialog-actions>
